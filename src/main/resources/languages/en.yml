      - '&#48ab76&lCreate a New Display Entity'
      - ''
      - '&8• &#7db597item [type] &8» &fCreate an item display'
      - '  &f(or of the item in your hand)'
      - '&8• &#7db597block [type] &8» &fCreate a block display'
